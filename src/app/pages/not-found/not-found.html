<section class="not-found" aria-labelledby="not-found-title">
  <div class="not-found__stars" aria-hidden="true"></div>

  <div class="not-found__shell">
    <div class="not-found__copy">
      <p class="sanaka-editorial-label">{{ 'notFound.eyebrow' | transloco }}</p>
      <p class="not-found__code" aria-hidden="true">404</p>

      <h1 id="not-found-title">
        <span>{{ 'notFound.title.line1' | transloco }}</span>
        <span>{{ 'notFound.title.line2' | transloco }}</span>
      </h1>

      <p class="not-found__description">{{ 'notFound.description' | transloco }}</p>

      <nav class="not-found__actions" [attr.aria-label]="'notFound.navigationLabel' | transloco">
        <a class="not-found__action not-found__action--primary" routerLink="/">
          {{ 'notFound.actions.home' | transloco }}
          <span aria-hidden="true">→</span>
        </a>
        <a class="not-found__action" routerLink="/matrix">
          {{ 'notFound.actions.matrix' | transloco }}
        </a>
      </nav>
    </div>

    <figure class="not-found__figure">
      <div class="not-found__aura" aria-hidden="true"></div>
      <img
        src="/images/not-found/nemi.png"
        width="1448"
        height="1086"
        [alt]="'notFound.imageAlt' | transloco"
      />
      <figcaption>
        <span aria-hidden="true"></span>
        {{ 'notFound.figureCaption' | transloco }}
        <span aria-hidden="true"></span>
      </figcaption>
    </figure>
  </div>
</section>
