<article class="post-card">
  @if (post().coverImageUrl) {
    <a
      class="post-card__image"
      [routerLink]="['/posts', post().slug]"
      target="_blank"
      rel="noopener"
      tabindex="-1"
    >
      <img
        [src]="post().coverImageUrl"
        [alt]="post().coverImageAlt ?? ''"
        loading="lazy"
        decoding="async"
      />
    </a>
  }

  <div class="post-card__content">
    <div class="post-card__meta">
      <span class="post-card__category">
        @for (category of post().categories; track category.id; let last = $last) {
          <a
            [href]="categoryHref(category.slug)"
            (click)="selectCategory($event, category.slug)"
            [attr.aria-label]="'posts.filters.browseCategory' | transloco: { name: category.name }"
            >{{ category.name }}</a
          >
          @if (!last) {
            <span aria-hidden="true"> · </span>
          }
        }
      </span>

      <time [attr.datetime]="post().publishedAt">
        {{ formattedPublishedAt() }}
      </time>
    </div>

    <h2 class="post-card__title">
      <a [routerLink]="['/posts', post().slug]" target="_blank" rel="noopener">
        {{ post().title }}
      </a>
    </h2>

    <p class="post-card__excerpt">
      {{ post().excerpt }}
    </p>
  </div>
</article>
