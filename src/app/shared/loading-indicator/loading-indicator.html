@if (artwork(); as art) {
  @if (art.kind === 'music') {
    <iframe
      class="loading-stage loading-stage--embed"
      data-kind="music"
      src="/loadings/sabala/hysteria/index.html"
      [title]="'Śabala — ' + label()"
      loading="eager"
      sandbox="allow-scripts allow-same-origin"
      tabindex="-1"
    ></iframe>
  } @else {
    <div
      class="loading-stage"
      [class.loading-stage--ready]="artworkReady()"
      [attr.data-kind]="art.kind"
      [style.--artwork-ratio]="art.width + ' / ' + art.height"
      aria-hidden="true"
    >
      @if (art.kind === 'snake') {
        <span class="snake-word">LOADING...</span>
      }
      <picture class="loading-artwork">
        <source media="(prefers-reduced-motion: no-preference)" [srcset]="art.animated" />
        <img
          [src]="art.poster"
          [width]="art.width"
          [height]="art.height"
          alt=""
          decoding="async"
          (load)="startDecoration()"
          (error)="hideFailedArtwork()"
        />
      </picture>
    </div>
  }
}
<p class="loading-label">{{ label() }}</p>
