<header class="app-header">
  <mat-toolbar>
    <a class="brand" routerLink="/" aria-label="Sanaka">
      <span>S</span>
      <span>A</span>
      <span>N</span>

      <span class="brand-a">
        A
        <img class="brand-flame" src="/images/brand/flame-03.png" alt="" aria-hidden="true" />
      </span>

      <span class="brand-k">K</span>
      <span>A</span>
    </a>

    <nav class="main-nav" [attr.aria-label]="'app.navigation.ariaLabel' | transloco">
      <a
        routerLink="/"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        {{ 'app.navigation.home' | transloco }}
      </a>

      <a routerLink="/posts" routerLinkActive="active-link" ariaCurrentWhenActive="page">
        {{ 'app.navigation.posts' | transloco }}
      </a>

      <a routerLink="/maya" routerLinkActive="active-link" ariaCurrentWhenActive="page">
        {{ 'app.navigation.maya' | transloco }}
      </a>
    </nav>

    <div class="lang-switcher" role="group" [attr.aria-label]="'app.language.selector' | transloco">
      <button
        type="button"
        class="lang-switcher__button"
        [class.lang-switcher__button--active]="isActiveLanguage('pt-BR')"
        [attr.aria-pressed]="isActiveLanguage('pt-BR')"
        (click)="setLanguage('pt-BR')"
      >
        PT
      </button>

      <button
        type="button"
        class="lang-switcher__button"
        [class.lang-switcher__button--active]="isActiveLanguage('en')"
        [attr.aria-pressed]="isActiveLanguage('en')"
        (click)="setLanguage('en')"
      >
        EN
      </button>
    </div>
  </mat-toolbar>
</header>

<main>
  <router-outlet />
</main>
