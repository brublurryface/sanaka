name: Browser critical flows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-flows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Production browser flows
    runs-on: ubuntu-24.04
    # Match the locked Playwright version: preinstalled Chromium, WebKit and OS dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use declared npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install locked dependencies
        run: npm ci
      - name: Check browser test types
        run: npm run test:e2e:types
      - name: Build production application
        run: npm run build
      - name: Exercise critical browser flows
        run: npm run test:e2e
      - name: Keep failure diagnostics
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 3
          if-no-files-found: ignore
