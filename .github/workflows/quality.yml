name: Qualidade

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatação, testes, duplicação e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Executar o controle de qualidade
        run: npm run check
