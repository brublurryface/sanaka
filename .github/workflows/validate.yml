name: Validate Sanaka

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  obolos:
    uses: ./.github/workflows/obolo-protocol.yml
  source:
    name: Source quality, tests and build
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use declared npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        id: formatting
        run: npm run format:check
      - name: Check architecture and type contracts
        run: npm run check:static
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Test Angular and server with coverage
        run: npm run check:tests
      - name: Check duplication and build production
        run: npm run check:build
      - name: Verify HTML conversion in Chromium
        run: npm run test:browser:security
      - name: Generate exact formatting diagnostics
        if: ${{ !cancelled() && steps.formatting.outcome == 'failure' }}
        run: |
          npm exec -- prettier --write .
          git diff --binary -- . > "$RUNNER_TEMP/prettier.patch"
          git diff --stat
      - name: Preserve formatting patch
        if: ${{ !cancelled() && steps.formatting.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: formatting-diagnostics
          path: ${{ runner.temp }}/prettier.patch
          retention-days: 7
          if-no-files-found: error
      - name: Preserve coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summaries
          path: |
            coverage/sanaka/coverage-summary.json
            coverage/server/coverage-summary.json
          retention-days: 14
          if-no-files-found: warn

  validate:
    name: Validate Sanaka
    needs: [source, obolos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both independent validations
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          OBOLOS_RESULT: ${{ needs.obolos.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$OBOLOS_RESULT" = success
